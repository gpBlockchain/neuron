name: Package Neuron for Test

on:
  workflow_dispatch:
    inputs:
      ckb_url:
        description: "GitHub URL for CKB. Use https://github.com/<owner>/<repo>/releases/tag/<tag> to download that Release, or https://github.com/<owner>/<repo>/tree/<branch-or-tag> to build that ref from source. Leave empty to use ckb_repo/ckb_ref or the official Release."
        type: string
        default: ""
      ckb_repo:
        description: "CKB GitHub repo (owner/name). Leave empty for nervosnetwork/ckb. This is a text field, not a live branch list."
        type: string
        default: ""
      ckb_ref:
        description: "CKB branch, tag, or SHA to build from source (for example develop). Leave empty to use the official Release in .ckb-version."
        type: string
        default: ""
      light_client_url:
        description: "GitHub URL for ckb-light-client. Use https://github.com/<owner>/<repo>/releases/tag/<tag> to download that Release, or https://github.com/<owner>/<repo>/tree/<branch-or-tag> to build that ref from source. Leave empty to use light_client_repo/light_client_ref or the official Release."
        type: string
        default: ""
      light_client_repo:
        description: "ckb-light-client GitHub repo (owner/name). Leave empty for nervosnetwork/ckb-light-client. This is a text field, not a live branch list."
        type: string
        default: ""
      light_client_ref:
        description: "ckb-light-client branch, tag, or SHA to build from source (for example develop). Leave empty to use the official Release in .ckb-light-version."
        type: string
        default: ""
      upload_packages:
        description: "Upload installers as artifacts. Required for sync jobs; non-official clients also require the separate opt-in."
        type: boolean
        default: true
      upload_private_packages:
        description: "Allow signed-in GitHub readers to download the specified private CKB rc3 in Windows/Linux test installers for 1 day."
        type: boolean
        default: false

  issue_comment:
    types: [created]
  push:

jobs:
  packaging:
    if: ${{ ((github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/package') && contains(fromJSON('["OWNER", "COLLABORATOR"]'), github.event.comment.author_association)) || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip package]')) }}

    strategy:
      fail-fast: false
      matrix:
        node: [22]
        os:
          - macos-15-intel
          - ubuntu-22.04
          - windows-2022

    runs-on: ${{ matrix.os }}
    outputs:
      # Each non-empty artifact ID comes from exactly one matrix leg.
      linux_artifact_id: ${{ steps.upload_linux.outputs.artifact-id }}
      windows_artifact_id: ${{ steps.upload_windows.outputs.artifact-id }}
      sensitive: ${{ steps.upload_decision.outputs.sensitive }}

    permissions:
      contents: read
      pull-requests: read

    name: ${{ matrix.os }}(Node.js ${{ matrix.node }})

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout for push or dispatch
        uses: actions/checkout@v4
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      - name: Checkout for PR
        uses: actions/checkout@v4
        if: ${{ github.event_name == 'issue_comment' }}
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge

      - name: Ensure no more commits after the triggering comment
        uses: actions/github-script@v7
        if: ${{ github.event_name == 'issue_comment' }}
        env:
          ISSUE_NUMBER: ${{github.event.issue.number}}
          COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            const { ISSUE_NUMBER, COMMENT_ID } = process.env
            let page = 1
            let hasFoundComment = false
            while(true) {
              const { data: timelines } = await github.rest.issues.listEventsForTimeline({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ISSUE_NUMBER,
                page,
                per_page: 100,
              })
              if (timelines.some(v => {
                hasFoundComment = hasFoundComment || (v.event === 'commented' && `${v.id}` === `${COMMENT_ID}`)
                return hasFoundComment && v.event === 'committed'
              })) {
                throw new Error('The last commit comes after the comment, please comment and package after last commit')
              }
              if (timelines.length === 0) {
                return
              }
              page += 1
            }

      - name: Resolve client sources
        shell: bash
        env:
          PACKAGE_COMMENT_BODY: ${{ github.event.comment.body || '' }}
          INPUT_CKB_SOURCE: ${{ inputs.ckb_source || '' }}
          INPUT_CKB_REPO: ${{ inputs.ckb_repo || '' }}
          INPUT_CKB_REF: ${{ inputs.ckb_ref || '' }}
          INPUT_CKB_URL: ${{ inputs.ckb_url || '' }}
          INPUT_CKB_ARTIFACT_RUN_ID: ${{ inputs.ckb_artifact_run_id || '' }}
          INPUT_CKB_ARTIFACT_NAME: ${{ inputs.ckb_artifact_name || '' }}
          INPUT_CKB_ASSET_NAME: ${{ inputs.ckb_asset_name || '' }}
          INPUT_LIGHT_CLIENT_SOURCE: ${{ inputs.light_client_source || '' }}
          INPUT_LIGHT_CLIENT_REPO: ${{ inputs.light_client_repo || '' }}
          INPUT_LIGHT_CLIENT_REF: ${{ inputs.light_client_ref || '' }}
          INPUT_LIGHT_CLIENT_URL: ${{ inputs.light_client_url || '' }}
          INPUT_LIGHT_CLIENT_ARTIFACT_RUN_ID: ${{ inputs.light_client_artifact_run_id || '' }}
          INPUT_LIGHT_CLIENT_ARTIFACT_NAME: ${{ inputs.light_client_artifact_name || '' }}
          INPUT_LIGHT_CLIENT_ASSET_NAME: ${{ inputs.light_client_asset_name || '' }}
          INPUT_UPLOAD_PACKAGES: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.upload_packages) || 'true' }}
        run: bash scripts/resolve-ckb-client-env.sh >> "$GITHUB_ENV"

      - name: Record upload decision
        shell: bash
        id: upload_decision
        env:
          PRIVATE_UPLOAD_OPT_IN: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'gpBlockchain/neuron' && github.ref == 'refs/heads/wasm' && inputs.upload_private_packages == true && 'true' || 'false' }}
        run: |
          sync_installers=false
          private_retention=0
          sensitive="${CKB_CLIENTS_SENSITIVE:-unknown}"
          if [ "${CKB_CLIENTS_SHOULD_UPLOAD:-false}" = true ] && [ "$sensitive" = false ]; then
            sync_installers=true
          elif [ "$PRIVATE_UPLOAD_OPT_IN" = true ] && [ "${UPLOAD_PACKAGES:-false}" = true ]; then
            if [ "$sensitive" != true ] ||
               [ "$CKB_REPO" != nervosnetwork/ckb-private ] ||
               [ "$CKB_SOURCE" != release ] ||
               [ "$CKB_REF" != v0.211.0-rc3 ] ||
               [ "$CKB_LIGHT_REPO" != nervosnetwork/ckb-light-client ] ||
               [ "$CKB_LIGHT_SOURCE" != source ] ||
               [ "$CKB_LIGHT_REF" != develop ]; then
              echo "::error::Private installer upload is limited to the approved CKB rc3 + public light-client develop inputs."
              exit 1
            fi
            sync_installers=true
            private_retention=1
          fi
          {
            echo "sync_installers=$sync_installers"
            echo "sensitive=$sensitive"
            echo "installer_retention_days=$private_retention"
          } >> "$GITHUB_OUTPUT"
          if [ "$sync_installers" = false ]; then
            echo "No Windows/Linux installers will be uploaded; package-based sync tests will not run." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$private_retention" = 1 ]; then
            echo "Windows/Linux test installers will be shared as GitHub Actions artifacts for one day." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Rust
        if: ${{ env.CKB_SOURCE == 'source' || env.CKB_LIGHT_SOURCE == 'source' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install source-build dependencies (Linux)
        if: ${{ runner.os == 'Linux' && (env.CKB_SOURCE == 'source' || env.CKB_LIGHT_SOURCE == 'source') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libssl-dev pkg-config protobuf-compiler

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "yarn"

      - name: Restore
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */*/node_modules
          key: 2022-12-21-${{ runner.os }}-${{ hashFiles('**/yarn.lock')}}

      - name: Add msbuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: "true"

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev

      - name: Install Lerna
        run: yarn global add lerna

      - name: Bootstrap
        run: |
          yarn
        env:
          CI: false

      - name: Write electron-build Test yml
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const ympPath = 'packages/neuron-wallet/electron-builder.yml'
            fs.writeFileSync(ympPath, fs.readFileSync(ympPath).toString().replace('asar: true', 'asar: false'))

      - name: Package for MacOS
        if: runner.os == 'macOS'
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          ./scripts/download-ckb.sh mac
          yarn package:test mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CKB_CLIENT_TOKEN: ${{ secrets.NEURON_DEP_GITHUB_TOKEN }}
          SKIP_NOTARIZE: true
          USE_HARD_LINKS: false

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ "$CKB_CLIENTS_SENSITIVE" = true ]; then
            exec 3>&1
            umask 077
            log_dir="$(cygpath -u "$RUNNER_TEMP")"
            exec > "$log_dir/neuron-private-package.log" 2>&1
            trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "::error::Windows packaging failed during ${phase:-setup} (exit $rc); private build logs were not shared." >&3; fi' EXIT
          fi
          phase="client-dependency preparation"
          bash ./scripts/download-ckb.sh win
          phase="Neuron build"
          yarn build
          phase="UI staging"
          bash ./scripts/copy-ui-files.sh
          phase="installer generation"
          bash ./scripts/package-for-test.sh win
        env:
          CKB_TEST_PRIVATE_INSTALLER_UPLOAD: ${{ steps.upload_decision.outputs.installer_retention_days == '1' && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CKB_CLIENT_TOKEN: ${{ secrets.NEURON_DEP_GITHUB_TOKEN }}

      - name: Package for Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "$CKB_CLIENTS_SENSITIVE" = true ]; then
            exec 3>&1
            umask 077
            exec > "$RUNNER_TEMP/neuron-private-package.log" 2>&1
            trap 'if [ "$?" -ne 0 ]; then echo "::error::Packaging failed; private build logs were not shared." >&3; fi' EXIT
          fi
          ./scripts/download-ckb.sh
          yarn package:test linux
        env:
          CKB_TEST_PRIVATE_INSTALLER_UPLOAD: ${{ steps.upload_decision.outputs.installer_retention_days == '1' && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CKB_CLIENT_TOKEN: ${{ secrets.NEURON_DEP_GITHUB_TOKEN }}
          USE_HARD_LINKS: false

      - name: Upload Neuron App Zip
        if: ${{ runner.os == 'macOS' && env.CKB_CLIENTS_SHOULD_UPLOAD == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Neuron-Mac-x64
          path: release/Neuron-*-mac-x64.zip

      - name: Upload Neuron App Zip(arm64)
        if: ${{ runner.os == 'macOS' && env.CKB_CLIENTS_SHOULD_UPLOAD == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Neuron-Mac-arm64
          path: release/Neuron-*-mac-arm64.zip

      - name: Upload Neuron Dmg
        if: ${{ runner.os == 'macOS' && env.CKB_CLIENTS_SHOULD_UPLOAD == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Neuron-Dmg-x64
          path: release/Neuron-*-x64.dmg

      - name: Upload Neuron Dmg(arm64)
        if: ${{ runner.os == 'macOS' && env.CKB_CLIENTS_SHOULD_UPLOAD == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Neuron-Dmg-arm64
          path: release/Neuron-*-arm64.dmg

      - name: Upload Neuron Win
        id: upload_windows
        if: ${{ runner.os == 'Windows' && steps.upload_decision.outputs.sync_installers == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Neuron-Win
          path: release/Neuron-*-setup.exe
          if-no-files-found: error
          retention-days: ${{ steps.upload_decision.outputs.installer_retention_days }}

      - name: Upload Neuron Linux
        id: upload_linux
        if: ${{ runner.os == 'Linux' && steps.upload_decision.outputs.sync_installers == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Neuron-Linux
          path: release/Neuron-*.AppImage
          if-no-files-found: error
          retention-days: ${{ steps.upload_decision.outputs.installer_retention_days }}

  comment_when_package_success:
    needs: [packaging]
    name: Append links to the Pull Request
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Comment by push event
        if: ${{ github.event_name == 'push' }}
        uses: peter-evans/commit-comment@v3
        with:
          body: |
            Packaging for test is done in [${{ github.run_id }}](https://github.com/${{github.repository}}/actions/runs/${{github.run_id}})

      - name: Comment by pull request comment event
        if: ${{ github.event_name == 'issue_comment' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          body: |
            Packaging for test is done in [${{ github.run_id }}](https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}). @${{ github.event.comment.user.login }}
          edit-mode: append

      - name: Comment by workflow dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && needs.packaging.outputs.sensitive == 'false' }}
        uses: peter-evans/commit-comment@v3
        with:
          body: |
            Packaging for test (workflow_dispatch) is done in [${{ github.run_id }}](https://github.com/${{github.repository}}/actions/runs/${{github.run_id}})

  comment_when_package_failed:
    needs: [packaging]
    if: ${{ always() && needs.packaging.result == 'failure' }}
    name: Append failed comment to the comment
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment by pull request comment event when package failed
        if: ${{ github.event_name == 'issue_comment' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          body: Packageing failed in [${{ github.run_id }}](https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}). @${{ github.event.comment.user.login }}
          edit-mode: append

  sync-test:
    if: ${{ !cancelled() && needs.packaging.outputs.linux_artifact_id != '' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/package -test'))) }}
    needs: [packaging]
    runs-on: ubuntu-22.04
    name: Native sync (ubuntu-22.04)
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || github.sha }}
          persist-credentials: false
      - name: Install libudev
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev
      - name: Download Neuron Linux
        uses: actions/download-artifact@v4
        with:
          name: Neuron-Linux
          path: packages/sync-test
      - name: ubuntu run
        run: |
          if [ "$PRIVATE_SYNC" = true ]; then
            exec 3>&1
            umask 077
            exec > "$RUNNER_TEMP/neuron-private-sync.log" 2>&1
            trap 'if [ "$?" -ne 0 ]; then echo "::error::Neuron sync failed; private test logs were not shared." >&3; fi' EXIT
          fi
          cd packages/sync-test
          yarn
          bash scripts/prepare_neuron_linux.sh
          xvfb-run --auto-servernum yarn sync-test
        env:
          PRIVATE_SYNC: ${{ needs.packaging.outputs.sensitive }}
      - name: tar result
        if: ${{ (failure() || cancelled()) && needs.packaging.outputs.sensitive == 'false' }}
        run: |
          tar -zcvf tmp.ubuntu-22.04.tar.gz packages/sync-test/tmp
      - name: Publish reports
        if: ${{ (failure() || cancelled()) && needs.packaging.outputs.sensitive == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: jfoa-build-reports-${{ runner.os }}
          path: tmp.ubuntu-22.04.tar.gz

  sync-test-windows:
    if: ${{ !cancelled() && needs.packaging.outputs.windows_artifact_id != '' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/package -test'))) }}
    needs: [packaging]
    runs-on: windows-2022
    name: Native sync (windows-2022)
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || github.sha }}
          persist-credentials: false
      - name: Download Neuron Win
        uses: actions/download-artifact@v4
        with:
          name: Neuron-Win
          path: packages/sync-test
      - name:  Windows run
        run: |
          cd packages\sync-test
          function Run-SyncStep($action) {
            if ($env:PRIVATE_SYNC -eq 'true') {
              & $action *>> "$env:RUNNER_TEMP/neuron-private-sync.log"
            } else {
              & $action
            }
            if ($LASTEXITCODE -ne 0) { throw 'Neuron native sync step failed.' }
          }
          Run-SyncStep { yarn }
          Run-SyncStep { .\scripts\prepare_neuron_windows.bat }
          Run-SyncStep { yarn sync-test }
        env:
          PRIVATE_SYNC: ${{ needs.packaging.outputs.sensitive }}
      - name: tar result
        if: ${{ (failure() || cancelled()) && needs.packaging.outputs.sensitive == 'false' }}
        run: |
          tar -zcvf tmp.windows-2022.tar.gz packages/sync-test/tmp
      - name: Publish reports
        if: ${{ (failure() || cancelled()) && needs.packaging.outputs.sensitive == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: jfoa-build-reports-${{ runner.os }}
          path: tmp.windows-2022.tar.gz

  sync-wasm-test:
    if: ${{ !cancelled() && needs.packaging.outputs.linux_artifact_id != '' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/package -test'))) }}
    needs: [packaging]
    strategy:
      matrix:
        node:
          - 20.19.0
        os:
          - ubuntu-22.04

    runs-on: ${{ matrix.os }}

    name: WASM sync (${{ matrix.os }})
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || github.sha }}
          persist-credentials: false


      - name: Install libudev
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev
      - name: Download Neuron App Zip(x64)
        if: matrix.os == 'macos-latest'
        uses: actions/download-artifact@v4
        with:
          name: Neuron-Mac-x64
          path: packages/sync-test
      - name: Download Neuron Linux
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/download-artifact@v4
        with:
          name: Neuron-Linux
          path: packages/sync-test
      - name: ubuntu run
        if: matrix.os == 'ubuntu-22.04'
        run: |
          if [ "$PRIVATE_SYNC" = true ]; then
            exec 3>&1
            umask 077
            exec > "$RUNNER_TEMP/neuron-private-sync.log" 2>&1
            trap 'if [ "$?" -ne 0 ]; then echo "::error::Neuron sync failed; private test logs were not shared." >&3; fi' EXIT
          fi
          cd packages/sync-test
          yarn
          bash scripts/prepare_neuron_linux.sh
          git clone https://github.com/gpBlockchain/ckb-light-wasm-demo.git
          cd ckb-light-wasm-demo
          git checkout gp/support-sqlite
          git submodule update --init --recursive
          bash build.sh
          cd ../
          xvfb-run --auto-servernum yarn sync-wasm-test
        env:
          PRIVATE_SYNC: ${{ needs.packaging.outputs.sensitive }}
      - name: tar result
        if: ${{ (failure() || cancelled()) && needs.packaging.outputs.sensitive == 'false' }}
        run: |
          tar -zcvf tmp.${{ matrix.os  }}.tar.gz packages/sync-test/tmp
      - name: Publish reports
        if: ${{ (failure() || cancelled()) && needs.packaging.outputs.sensitive == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: jfoa-build-reports-wasm-${{ runner.os }}
          path: tmp.${{ matrix.os  }}.tar.gz
